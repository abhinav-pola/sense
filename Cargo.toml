[workspace]
resolver = "3"
members = ["crates/sense", "crates/sense-agent", "crates/sense-auth", "crates/sense-core"]
default-members = ["crates/sense"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
sense-agent = { path = "crates/sense-agent" }
sense-auth = { path = "crates/sense-auth" }
sense-core = { path = "crates/sense-core" }
agent-client-protocol = "3.4"
anyhow = "1"
gpui-kit = "0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"

# Startup fix: skips a full system font enumeration on macOS (~110 ms).
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

# `cargo app`: optimized like release, but rebuilt in seconds: no LTO,
# parallel codegen, incremental. Release (LTO, one codegen unit) is for the
# bundle and the benchmarks.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
strip = false

[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
